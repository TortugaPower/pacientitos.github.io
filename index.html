<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pacientitos</title>
	<link rel="icon" type="image/png" href="/icon.png">
	<meta name="description" content="Registro fotográfico clínico para consultas médicas. Cuatro tomas guiadas por visita —frente, espalda, derecha e izquierda— para comparar la evolución de cada paciente.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
	<style>
		* {
			margin: 0;
			padding: 0;
			border: 0;
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			display: grid;
			align-content: center;
			justify-content: center;
			overflow: auto;
			background: #fff;
			font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			padding: 24px;
		}

		.card {
			width: 380px;
			max-width: 100%;
			padding: 40px 28px 28px;
			border: 1px solid #e5e5e7;
			border-radius: 20px;
			text-align: center;
		}

		.logo {
			width: 140px;
			height: 140px;
			border-radius: 22.4%;
		}

		.wordmark {
			margin-top: 16px;
			font-size: 40px;
			font-weight: 300;
			color: #324a5e;
		}

		.support {
			margin-top: 28px;
			font-size: 14px;
			line-height: 1.6;
			color: #48484a;
		}

		.support a {
			color: #324a5e;
		}

		.legal {
			margin-top: 24px;
			font-size: 13px;
			color: #8e8e93;
		}

		.legal a {
			color: #8e8e93;
			text-decoration: none;
		}

		.legal a:hover {
			text-decoration: underline;
		}
	</style>
</head>
<body>
	<main class="card">
		<img class="logo" src="/icon.png" alt="Pacientitos" width="140" height="140">
		<h1 class="wordmark">Pacientitos</h1>
		<p class="support">
			¿Necesitas ayuda? Escríbenos a<br>
			<a href="mailto:support@tortugapower.com">support@tortugapower.com</a>
		</p>
		<p class="legal">
			<a href="/privacidad/">Política de Privacidad</a> &middot;
			<a href="/privacy/">Privacy Policy</a>
		</p>
	</main>
</body>
</html>
