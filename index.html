<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pacientitos</title>
	<meta name="description" content="Registro fotográfico clínico para consultas médicas. Cuatro tomas guiadas por visita —frente, espalda, derecha e izquierda— para comparar la evolución de cada paciente.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
	<style>
		* {
			margin: 0;
			padding: 0;
			border: 0;
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			display: grid;
			align-content: center;
			justify-content: center;
			overflow: auto;
			background: #fff;
			font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			padding: 24px;
		}

		.card {
			width: 380px;
			max-width: 100%;
			padding: 40px 28px 28px;
			border: 1px solid #e5e5e7;
			border-radius: 20px;
			text-align: center;
		}

		.logo {
			width: 140px;
			height: 140px;
		}

		.wordmark {
			margin-top: 16px;
			font-size: 40px;
			font-weight: 300;
			color: #0369a1;
		}

		.tagline {
			margin-top: 10px;
			font-size: 15px;
			line-height: 1.5;
			color: #48484a;
		}

		.support {
			margin-top: 28px;
			font-size: 14px;
			line-height: 1.6;
			color: #48484a;
		}

		.support a {
			color: #0369a1;
		}

		.legal {
			margin-top: 24px;
			font-size: 13px;
			color: #8e8e93;
		}

		.legal a {
			color: #8e8e93;
			text-decoration: none;
		}

		.legal a:hover {
			text-decoration: underline;
		}
	</style>
</head>
<body>
	<main class="card">
		<svg class="logo" viewBox="0 0 96 96" role="img" aria-label="Pacientitos">
			<rect x="10" y="10" width="34" height="34" rx="6" fill="#f0f9ff" stroke="#0369a1" stroke-width="4"/>
			<rect x="52" y="10" width="34" height="34" rx="6" fill="#f0f9ff" stroke="#0369a1" stroke-width="4"/>
			<rect x="10" y="52" width="34" height="34" rx="6" fill="#f0f9ff" stroke="#0369a1" stroke-width="4"/>
			<rect x="52" y="52" width="34" height="34" rx="6" fill="#f0f9ff" stroke="#0369a1" stroke-width="4"/>
			<circle cx="27" cy="23" r="5" fill="#0369a1"/>
			<path d="M18 37c0-5 4-8 9-8s9 3 9 8" fill="#0369a1"/>
			<circle cx="69" cy="23" r="5" fill="#0369a1"/>
			<path d="M60 37c0-5 4-8 9-8s9 3 9 8" fill="#0369a1"/>
			<circle cx="27" cy="65" r="5" fill="#0369a1"/>
			<path d="M18 79c0-5 4-8 9-8s9 3 9 8" fill="#0369a1"/>
			<circle cx="69" cy="65" r="5" fill="#0369a1"/>
			<path d="M60 79c0-5 4-8 9-8s9 3 9 8" fill="#0369a1"/>
		</svg>
		<h1 class="wordmark">Pacientitos</h1>
		<p class="tagline">
			Registro fotográfico clínico. Cuatro tomas guiadas por visita
			—frente, espalda, derecha e izquierda— para comparar la evolución
			de cada paciente a lo largo del tiempo.
		</p>
		<p class="support">
			¿Necesitas ayuda? Escríbenos a<br>
			<a href="mailto:support@tortugapower.com">support@tortugapower.com</a>
		</p>
		<p class="legal">
			<a href="/privacidad/">Política de Privacidad</a> &middot;
			<a href="/privacy/">Privacy Policy</a>
		</p>
	</main>
</body>
</html>
